<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duck vs. Lava: Taco Catch</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <h1>🦆 Duck vs. Lava 🌮</h1>
    <p class="hud">
      Score: <strong id="score">0</strong> &nbsp;|&nbsp; Best: <strong id="best">0</strong>
    </p>
    <p id="compliment" aria-live="polite">Catch tacos. Avoid the lava. You've got this.</p>
    <div class="stage">
      <canvas id="game" width="360" height="520"></canvas>
      <div id="overlay">
        <h2 id="overlay-title">Ready?</h2>
        <p id="overlay-text">Move with ← → (or A / D), or drag on the screen.<br>Every missed taco raises the lava!</p>
        <button id="start">Start</button>
      </div>
    </div>
  </main>
  <script src="./app.js"></script>
</body>
</html>
